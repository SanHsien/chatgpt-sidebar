version: 2
updates:
  # 這個擴充功能沒有 package.json，執行期不引任何第三方套件（純 vanilla JS）；
  # 唯一可由機器更新的依賴面是 workflow 裡釘住的 actions。所以本 repo 也沒有
  # 每月的依賴新鮮度檢查——沒有宣告可以拿來跟現行版比。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
