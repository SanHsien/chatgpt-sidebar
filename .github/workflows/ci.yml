name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Extension validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Syntax check
        run: node --check background.js content.js panel.js

      - name: Unit tests
        run: node --test "tools/tests/*.test.mjs"

      - name: Validate extension layout
        run: node tools/validate-extension.mjs

      - name: Diff whitespace check
        run: git diff --check
