<!doctype html>
<!--
  panel.html
  This file defines the UI for the extension's side panel. It contains a
  single button which, when clicked, sends a request to summarize the
  current page's content by populating a prompt in the pinned ChatGPT tab.
-->
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: sans-serif;
        margin: 16px;
        padding: 0;
      }
      button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      .note {
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <button id="summarize">摘要當前頁面</button>
    <div class="note">
      按下按鈕後，擴充套件會在 ChatGPT 的輸入框填入摘要提示。（請先登入 ChatGPT）
    </div>
    <script src="panel.js"></script>
  </body>
</html>
